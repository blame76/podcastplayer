name: Test and deploy podcast player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: podcast-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      deploy_enabled: ${{ steps.deploy_gate.outputs.enabled }}
    steps:
      - name: Read deployment switch from github-pages environment
        id: deploy_gate
        env:
          DEPLOY_ENABLED: ${{ vars.PODCAST_DEPLOY_ENABLED }}
        run: |
          if [[ "$DEPLOY_ENABLED" == 'true' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, simplexml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: bin/test
      - name: Build static player
        run: bin/build
      - uses: actions/configure-pages@v5
        if: steps.deploy_gate.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.deploy_gate.outputs.enabled == 'true'
        with:
          path: _site

  deploy-provider:
    if: needs.build.outputs.deploy_enabled == 'true'
    environment: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Strato SSH identity and host key
        env:
          DEPLOY_KEY: ${{ secrets.PODCAST_SFTP_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PODCAST_SFTP_KNOWN_HOSTS || vars.PODCAST_SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo '::error::PODCAST_SFTP_PRIVATE_KEY fehlt im github-pages-Environment.'
            exit 1
          fi
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo '::error::PODCAST_SFTP_KNOWN_HOSTS fehlt im github-pages-Environment (Secret oder Variable).'
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/podcast_strato_key"
          chmod 600 "$RUNNER_TEMP/podcast_strato_key"
      - name: Upload PHP demo provider to Strato
        env:
          PODCAST_SFTP_HOST: ${{ vars.PODCAST_SFTP_HOST }}
          PODCAST_SFTP_USER: ${{ vars.PODCAST_SFTP_USER }}
          PODCAST_SFTP_PORT: ${{ vars.PODCAST_SFTP_PORT }}
          PODCAST_SFTP_TARGET: ${{ vars.PODCAST_SFTP_TARGET }}
          PODCAST_SFTP_KEY: ${{ runner.temp }}/podcast_strato_key
        run: bin/deploy-provider-demo --upload
      - name: Verify public PHP demo provider
        run: bin/verify-provider-demo

  deploy-pages:
    if: needs.build.outputs.deploy_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, deploy-provider]
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
